# ---------------------------------------------------------------------------
# A FIXTURE bill, drafted against examples/starter/fixture-constitution.yaml.
#
# The Marrow Vale Lamplighters' Guild does not exist. This bill amends nothing
# real and must never be pointed at constitution/current.yaml.
#
# It carries ONE operation of every kind the schema allows — substitute,
# insert, omit, retitle, reserve — and a complete set of approvals that clears
# two thirds in each of the three bodies separately as well as pooled, so
# tests/bill.test.mjs has a bill that is valid in every respect and can be
# broken one field at a time to prove each rule.
# ---------------------------------------------------------------------------

