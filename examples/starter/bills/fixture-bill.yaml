# Explanatory only. Nothing below is operative, and no operation may take its
# content from here — the operations carry their own text, and the validator
# refuses any that reaches back into this block.
objects_and_reasons: |
  1. Article 3 is set out afresh so that the duties of a lamplighter and the
     position of apprentices appear in the article itself rather than in the
     by-laws.
  2. Article 6 is cleared and its number held, meetings of the Council having
     been moved to the by-laws.
  3. Article 7 is repealed, the Taper Fund being absorbed into the fund
     established by the new Article 10.
  4. The heading of Article 8, section 1 is given by this Act, the existing
     heading having been supplied by an editor.
  5. Article 10 is inserted to establish the Lantern Oil Fund.

operations:
  # substitute — the whole article, sections and all, written out in full.
  - id: op-1
    operation: substitute
    target: art-3
    scope: article
    title: Membership
    text: |
      Membership of the Guild is open to any person of the Vale who keeps a
      lamp, abides by these articles, and is entered in the Lantern Roll.
    sections:
      - number: 1
        title: Admission
        text: |
          A person becomes a lamplighter on being entered in the Lantern Roll
          by the Council, and not before.
      - number: 2
        title: Duties
        text: |
          A lamplighter shall light the lamps of their assigned round at dusk,
          extinguish them at dawn, and report a broken glass to the Keeper of
          the Oil within three days.
      - number: 3
        title: Apprentices
        text: |
          An apprentice may be entered in the Lantern Roll on the
          recommendation of two lamplighters, and shall not climb a ladder
          unaccompanied until their second Michaelmas.
      - number: 4
        title: Withdrawal
        text: |
          A lamplighter may withdraw at any time by returning their taper to
          the Keeper of the Roll, who shall record the date in the Lantern
          Roll.

  # insert — a provision that does not yet exist at the base version.
  - id: op-2
    operation: insert
    target: art-10
    scope: article
    title: The Lantern Oil Fund
    text: |
      1. There shall be a Lantern Oil Fund, held by the Keeper of the Oil, into
         which are paid the admission pennies of lamplighters and any gift made
         to the Guild for the buying of oil.
      2. The Fund may be expended only on oil, wicks, glass, tapers and the
         repair of ladders.
      3. The Keeper of the Oil shall lay an account of the Fund before the
         Guild at each Michaelmas meeting.

  # omit — the provision is repealed. Its number is never reused, so no text
  # is supplied and none may be.
  - id: op-3
    operation: omit
    target: art-7
    scope: article
    note: |
      The Taper Fund is absorbed into the Lantern Oil Fund established by
      Article 10. Article 7 keeps its number as an omitted provision so that
      every citation ever made to it still resolves.

  # retitle — the heading only. The text of the section is untouched, and the
  # heading stops being editorial and becomes enacted.
  - id: op-4
    operation: retitle
    target: art-8-s-1
    scope: clause
    title: The Lantern Roll
    note: |
      The existing heading was supplied by an editor. This Act states it, so
      that the heading a reader sees is the heading the Guild passed.

  # reserve — the number is held against a future instrument, and carries no
  # text in the meantime.
  - id: op-5
    operation: reserve
    target: art-6
    scope: article
    note: |
      Meetings of the Council pass to the by-laws. Article 6 is reserved
      rather than omitted because the Guild intends to occupy the number again
      when the by-laws are settled.

# Article 16(3) of the enacting organization's constitution requires the board,
# the intermediate board and the units. All three are recorded here, with the
# minutes that evidence each. Abstentions are excluded from the threshold: the
# requirement is of those present AND VOTING.
#
# Each body clears two thirds on its own (86.4%, 78.6%, 75.7%), and the pooled
# vote clears it too (58 of 73, 79.5%), so this bill is properly passed on
# either reading of "collectively".
approvals:
