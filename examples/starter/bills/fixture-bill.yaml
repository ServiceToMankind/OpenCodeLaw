    date: 2026-04-11
    present: 24
    for: 19
    against: 3
    abstain: 2
    evidence: Board minutes 2026/09, item 2
  - body: intermediate-board
    date: 2026-04-12
    present: 15
    for: 11
    against: 3
    abstain: 1
    evidence: Intermediate board minutes 2026/04, item 5
  - body: units
    date: 2026-04-14
    present: 41
    for: 28
    against: 9
    abstain: 4
    evidence: Joint minutes 2026/07, annexure B (unit-by-unit poll)

