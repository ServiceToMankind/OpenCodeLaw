info:
  title: SERVICE TO MANKIND
  organization: Service to Mankind Welfare Association
  jurisdiction: Telangana, India
  version: 3.0.0-alpha.1
  status: current
  effective_from: "2024-05-03"
  logo:
    url: https://stmorg.in/accesories/service_to_man_kind-20200709-0001.jpg
    alt: Logo
  contact:
    name: Pranay Kiran
    email: pranay@stmorg.in
  license: MIT
reconciliation_state:
  target_version: 3.0.0
  complete: false
  applied:
    - act-1-2024 (partial)
  held:
    - provisions:
        - art-6
        - art-7
      blocked_by: Q2
      note: Act 1 of 2024 also amends Articles 6 and 7. Both are word-for-word their pre-Act text. Act 1 substitutes clauses (1)-(5) of Article 6 and is silent on clause (6), Donor; applying it requires knowing whether that clause survives.
    - provisions:
        - act-2-2024
        - act-3-2024
      blocked_by:
        - Q4
        - Q7
        - Q10
        - Q12
